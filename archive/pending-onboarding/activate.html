<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Activá tu acceso · Restia</title>
  <link rel="icon" href="/assets/restia-favicon.png">
  <link rel="stylesheet" href="/activate.css">
  <script src="/checkout-config.js"></script>
  <script type="module" src="/activate.mjs"></script>
</head>
<body>
  <main>
    <img class="brand" src="/assets/restia-wordmark.png" alt="Restia">
    <p class="eyebrow">Tu negocio, conectado</p>
    <h1>Creá tu contraseña</h1>
    <p id="context">Estamos comprobando tu invitación…</p>
    <form id="activation-form" hidden>
      <label>Usuario<input id="username" autocomplete="username" readonly></label>
      <label>Nueva contraseña<input name="password" type="password" required minlength="10" maxlength="128" autocomplete="new-password"></label>
      <label>Repetí la contraseña<input name="confirm" type="password" required minlength="10" maxlength="128" autocomplete="new-password"></label>
      <small>Usá al menos 10 caracteres. Elegí una contraseña que no utilices en otros servicios.</small>
      <button type="submit">Activar mi acceso</button>
    </form>
    <p id="message" role="status" aria-live="polite"></p>
    <a id="open-panel" class="button" hidden>Ingresar a mi panel</a>
    <p class="help">¿Necesitás ayuda? <a href="mailto:atencion@restia.net.ar">Contactá a Restia</a></p>
  </main>
</body>
</html>
