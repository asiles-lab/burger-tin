<svg xmlns="http://www.w3.org/2000/svg" width="920" height="1050" viewBox="0 0 920 1050" role="img" aria-labelledby="title desc">
<title id="title">Composición conceptual de cosmética GlowRo</title><desc id="desc">Frascos minimalistas sobre pedestales en una escena color durazno.</desc>
<defs>
  <linearGradient id="bg" x1="0" x2="1" y2="1"><stop stop-color="#f5ded5"/><stop offset=".52" stop-color="#f8ece5"/><stop offset="1" stop-color="#eacfd1"/></linearGradient>
  <radialGradient id="light"><stop stop-color="#fffdf6" stop-opacity=".88"/><stop offset="1" stop-color="#fffdf6" stop-opacity="0"/></radialGradient>
  <linearGradient id="pod" x1="0" x2="1" y2="1"><stop stop-color="#fcf7f2"/><stop offset="1" stop-color="#d2bdb7"/></linearGradient>
  <linearGradient id="glass" x1="0" x2="1"><stop stop-color="#e4bcae"/><stop offset=".2" stop-color="#fffaf0"/><stop offset=".62" stop-color="#f8dfd1"/><stop offset="1" stop-color="#cf9e94"/></linearGradient>
  <linearGradient id="lotion" x1="0" x2="1"><stop stop-color="#e7d4ce"/><stop offset=".34" stop-color="#fffefb"/><stop offset=".72" stop-color="#f9f1ee"/><stop offset="1" stop-color="#d4b5ad"/></linearGradient>
  <linearGradient id="tube" x1="0" x2="1"><stop stop-color="#f4a998"/><stop offset=".47" stop-color="#ffe7d3"/><stop offset="1" stop-color="#e2a49a"/></linearGradient>
  <linearGradient id="cap" x1="0" x2="1"><stop stop-color="#af8e8c"/><stop offset=".38" stop-color="#efe6e2"/><stop offset="1" stop-color="#b19b98"/></linearGradient>
  <filter id="shadow" x="-50%" y="-50%" width="200%" height="220%"><feGaussianBlur stdDeviation="23"/></filter>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="45"/></filter>
</defs>
<rect width="920" height="1050" fill="url(#bg)"/>
<circle cx="190" cy="160" r="290" fill="url(#light)"/>
<circle cx="725" cy="305" r="220" fill="#fff6e9" opacity=".58" filter="url(#blur)"/>
<path d="M835 -50C665 220 702 360 920 420V0Z" fill="#fbece4" opacity=".53"/>
<path d="M0 730C255 639 657 650 920 781V1050H0Z" fill="#e4bcb5" opacity=".35"/>
<!-- distant sculptural arch -->
<path d="M128 553V320c0-173 141-291 312-291s315 123 315 291v233H631V326c0-110-73-180-188-180S256 220 256 326v227Z" fill="#fffaf2" opacity=".23"/>
<!-- podiums -->
<ellipse cx="470" cy="902" rx="414" ry="78" fill="#906d6b" opacity=".15" filter="url(#shadow)"/>
<rect x="90" y="749" width="740" height="225" rx="17" fill="url(#pod)"/>
<ellipse cx="460" cy="751" rx="370" ry="57" fill="#fbf1e8"/>
<rect x="480" y="666" width="350" height="139" rx="13" fill="#e5ccc6"/>
<ellipse cx="655" cy="666" rx="175" ry="35" fill="#f9eee7"/>
<ellipse cx="470" cy="733" rx="270" ry="43" fill="#9b7572" opacity=".12" filter="url(#shadow)"/>
<!-- tube back right -->
<g transform="rotate(9 681 460)">
<path d="M624 348L737 348L723 685Q681 712 637 685Z" fill="url(#tube)" stroke="#f0c3ae" stroke-width="2"/>
<rect x="639" y="679" width="85" height="31" rx="6" fill="#f5f0e8" stroke="#f0d9d0"/>
<path d="M630 356H730" stroke="#fffbf5" stroke-opacity=".75" stroke-width="4"/>
<text x="680" y="461" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" letter-spacing="3.5" font-weight="600" fill="#6b4f50">glowro</text>
<path d="M656 497H706" stroke="#b6807b" stroke-width="1.3"/>
<text x="680" y="525" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" letter-spacing="1.4" fill="#926664">DAILY CARE</text>
</g>
<!-- central pump -->
<ellipse cx="460" cy="738" rx="115" ry="22" fill="#977772" opacity=".2" filter="url(#shadow)"/>
<rect x="365" y="300" width="190" height="443" rx="36" fill="url(#lotion)" stroke="#f6e8e1" stroke-width="3"/>
<path d="M385 340v340" stroke="#fff" stroke-opacity=".73" stroke-width="6" stroke-linecap="round"/>
<rect x="403" y="235" width="114" height="85" rx="17" fill="url(#cap)"/>
<path d="M445 232v-48c0-17 15-28 30-28h74v21h-65c-8 0-14 6-14 14v41" fill="#e9dad5"/>
<path d="M411 375h100" stroke="#b8a6a1" opacity=".5"/>
<text x="460" y="481" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="600" letter-spacing="4" fill="#5c5152">glowro</text>
<circle cx="523" cy="457" r="5" fill="#d3a79f"/>
<text x="460" y="519" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" letter-spacing="3" fill="#867777">SKIN RITUALS</text>
<path d="M427 556h66" stroke="#bba9a6"/>
<text x="460" y="610" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" letter-spacing="1" fill="#9a8984">everyday glow</text>
<!-- serum left -->
<ellipse cx="236" cy="764" rx="100" ry="16" fill="#835c59" opacity=".23" filter="url(#shadow)"/>
<rect x="149" y="487" width="174" height="277" rx="25" fill="url(#glass)" stroke="#faeee4" stroke-width="2"/>
<rect x="188" y="427" width="96" height="75" rx="8" fill="url(#cap)"/>
<rect x="218" y="350" width="38" height="88" rx="19" fill="#fffdf5"/>
<path d="M159 528v194" stroke="#fff" opacity=".72" stroke-width="7" stroke-linecap="round"/>
<rect x="173" y="568" width="126" height="105" rx="4" fill="#faf1e9" opacity=".75"/>
<text x="236" y="611" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" letter-spacing="2" font-weight="600" fill="#68514e">glowro</text>
<text x="236" y="641" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" letter-spacing="2" fill="#8c706a">THE SERUM</text>
<!-- accents -->
<circle cx="742" cy="228" r="7" fill="#fff8f2" opacity=".85"/>
<path d="M114 170l11 32 32 11-32 11-11 32-11-32-32-11 32-11Z" fill="#fff9f2" opacity=".65"/>
<path d="M819 554l7 20 20 7-20 7-7 20-7-20-20-7 20-7Z" fill="#fff9f2" opacity=".58"/>
</svg>
